<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body style="background-color: #FAF3E0;">

<body class="container mt-5">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Sistema de Gestión de Panadería
        </span>
    </div>
</nav>

<h1 class="text-center mb-4">
    Lista de Clientes
</h1>

<div th:if="${mensajeExito}"
     class="alert alert-success">
    <span th:text="${mensajeExito}"></span>
</div>

<div th:if="${mensajeError}"
     class="alert alert-danger">
    <span th:text="${mensajeError}"></span>
</div>

<a href="/"
   class="btn btn-dark mb-3">
    <i class="bi bi-arrow-left"></i>
    Volver
</a>

<a href="/clientes/nuevo"
   class="btn btn-primary mb-3">

    <i class="bi bi-plus-circle"></i>
    Nuevo Cliente
</a>

<table class="table table-striped table-hover table-bordered">

    <thead>
    <tr>

        <th>ID</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Acciones</th>

    </tr>
    </thead>

    <tbody>

    <tr th:each="cliente : ${clientes}">

        <td th:text="${cliente.id}"></td>
        <td th:text="${cliente.nombre}"></td>
        <td th:text="${cliente.telefono}"></td>
        <td th:text="${cliente.correo}"></td>

        <td>
            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
               class="btn btn-warning btn-sm">
                <i class="bi bi-pencil"></i>
                Editar
            </a>

            <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Está seguro de eliminar este cliente?');">
               <i class="bi bi-trash"></i>
               Eliminar
            </a>

        </td>
    </tr>

    </tbody>

</table>

</body>
</html>
