<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sistema Panadería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .text-brown {
            color: #8B5E3C;
        }
    </style>
</head>

<body style="background-color: #FAF3E0;">

<div class="container mt-5">
    <div class="text-center mb-5">
        <img src="/img/pan.png"
             alt="Logo Panadería"
             width="400"
             class="mb-3">
        <h1 class="display-4 fw-bold text-brown">
            Sistema de Gestión
        </h1>
        <p class="lead">
            Panel principal del sistema
        </p>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h3>Categorías</h3>
                    <i class="bi bi-tags-fill fs-1 d-block mb-3"></i>
                    <a href="/categorias"
                       class="btn btn-primary mt-3">
                        Ir
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h3>Productos</h3>
                    <i class="bi bi-box-seam-fill fs-1 d-block mb-3"></i>
                    <a href="/productos"
                       class="btn btn-success mt-3">
                        Ir
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h3>Clientes</h3>
                    <i class="bi bi-people-fill fs-1 d-block mb-3"></i>
                    <a href="/clientes"
                       class="btn btn-warning mt-3">
                        Ir
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h3>Ventas</h3>
                    <i class="bi bi-cart-check-fill fs-1 d-block mb-3"></i>
                    <a href="/ventas"
                       class="btn btn-danger mt-3">
                        Ir
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
