<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-5">

<h1>Ventas</h1>

<a href="/"
   class="btn btn-dark mb-3">
    Volver
</a>

<a href="/ventas/nuevo"
   class="btn btn-primary mb-3">
    Nueva Venta

</a>

<table class="table table-bordered">

    <thead>

    <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Cliente</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="venta : ${ventas}">
        <td th:text="${venta.id}"></td>
        <td th:text="${venta.fecha}"></td>
        <td th:text="${venta.total}"></td>
        <td>
    <span th:if="${venta.estado == 'PAGADO'}"
          class="badge bg-success">
        PAGADO
    </span>
            <span th:if="${venta.estado == 'PENDIENTE'}"
                  class="badge bg-warning text-dark">
        PENDIENTE
    </span>
            <span th:if="${venta.estado == 'ENTREGADO'}"
                  class="badge bg-primary">
        ENTREGADO
    </span>
            <span th:if="${venta.estado == 'CANCELADO'}"
                  class="badge bg-danger">
        CANCELADO
    </span>
        </td>
        <td th:text="${venta.cliente.nombre}"></td>
    </tr>

    </tbody>

</table>

</body>
</html>
