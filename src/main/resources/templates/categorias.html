<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #FAF3E0;">

<body class="container mt-5">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Sistema de Gestión de Panadería
        </span>
    </div>
</nav>

<h1 class="text-center mb-4">
    Lista de Categorías
</h1>

<a href="/"
   class="btn btn-dark mb-3">
   <i class="bi bi-arrow-left"></i>
   Volver
</a>

<a href="/categorias/nuevo"
   class="btn btn-primary mb-3">
   <i class="bi bi-plus-circle"></i>
   Nueva Categoría
</a>

<table class="table table-striped table-hover table-bordered">

    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="categoria : ${categorias}">
        <td th:text="${categoria.id}"></td>
        <td th:text="${categoria.nombre}"></td>
        <td>
            <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
               class="btn btn-warning btn-sm">
               <i class="bi bi-pencil"></i>
               Editar
            </a>
            <a th:href="@{/categorias/eliminar/{id}(id=${categoria.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Está seguro de eliminar esta categoria?');">
               <i class="bi bi-trash"></i>
               Eliminar
            </a>
        </td>
    </tr>

    </tbody>

</table>

</body>
</html>
