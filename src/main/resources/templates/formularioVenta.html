<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #FAF3E0;"
      class="container mt-5">

<h1 class="text-center mb-4">
    Nueva Venta
</h1>

<div th:if="${error}"
     class="alert alert-danger">
    <span th:text="${error}"></span>
</div>

<form th:action="@{/ventas/agregar-producto}"
      method="post">

    <div class="mb-3">
        <label class="form-label">
            Producto
        </label>
        <select name="productoId"
                class="form-select">
            <option value="">
                Seleccione un producto
            </option>
            <option th:each="producto : ${productos}"
                    th:value="${producto.id}"
                    th:text="${producto.nombre}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Cantidad
        </label>

        <input type="number"
               name="cantidad"
               class="form-control">
    </div>

    <button type="submit"
            class="btn btn-success">
        Agregar Producto
    </button>

</form>

    <hr>
    <h3>Carrito</h3>

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
        </tr>

        </thead>
        <tbody>

        <tr th:each="detalle : ${carrito}">

            <td th:text="${detalle.producto.nombre}"></td>
            <td th:text="${detalle.cantidad}"></td>
            <td th:text="${detalle.subtotal}"></td>
        </tr>

        </tbody>
    </table>

    <h4>
        Total:
        <span th:text="${total}"></span>
    </h4>
    <hr>

    <form th:action="@{/ventas/confirmar}"
          method="post">

        <div class="mb-3">
            <label class="form-label">
                Cliente
            </label>
            <select name="clienteId"
                    class="form-select">
                <option value="">
                    Seleccione un cliente
                </option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre}">
                </option>
            </select>
        </div>

        <div class="mb-3">

            <label class="form-label">
                Estado
            </label>
            <select name="estado"
                    class="form-select">
                <option value="PENDIENTE">
                    PENDIENTE
                </option>
                <option value="PAGADO">
                    PAGADO
                </option>
                <option value="ENTREGADO">
                    ENTREGADO
                </option>
                <option value="CANCELADO">
                    CANCELADO
                </option>
            </select>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Confirmar Venta
        </button>

        <a href="/ventas"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</body>
</html>
