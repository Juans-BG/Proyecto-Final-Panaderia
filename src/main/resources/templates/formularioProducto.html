<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Nuevo Producto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #FAF3E0;"
      body class="container mt-5">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Sistema de Gestión de Panadería
        </span>
  </div>
</nav>

<h1 class="text-center mb-4">
  Nuevo Producto
</h1>

<form th:action="@{/productos/guardar}"
      th:object="${producto}"
      method="post">
  <input type="hidden"
         th:field="*{id}">

  <div class="mb-3">
    <label class="form-label">
      Nombre
    </label>

    <input type="text"
           th:field="*{nombre}"
           class="form-control">
    <div class="text-danger"
         th:if="${#fields.hasErrors('nombre')}"
         th:errors="*{nombre}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">
      Precio
    </label>
    <input type="number"
           th:field="*{precio}"
           class="form-control">
    <div class="text-danger"
         th:if="${#fields.hasErrors('precio')}"
         th:errors="*{precio}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">
      Stock
    </label>
    <input type="number"
           th:field="*{stock}"
           class="form-control">
    <div class="text-danger"
         th:if="${#fields.hasErrors('stock')}"
         th:errors="*{stock}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">
      Categoría
    </label>
    <select th:field="*{categoria}"
            class="form-select">
      <option value="">
        Seleccione una categoría
      </option>
      <option th:each="categoria : ${categorias}"
              th:value="${categoria.id}"
              th:text="${categoria.nombre}">
      </option>
    </select>
    <div class="text-danger"
         th:if="${#fields.hasErrors('categoria')}"
         th:errors="*{categoria}">
    </div>
  </div>

  <button type="submit"
          class="btn btn-success">
    Guardar
  </button>

  <a href="/productos"
     class="btn btn-secondary">
    Cancelar
  </a>

</form>

</body>
</html>
