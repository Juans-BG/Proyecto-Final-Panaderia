<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body style="background-color: #FAF3E0;"
      body class="container mt-5">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Sistema de Gestión de Panadería
        </span>
  </div>
</nav>

<h1 class="text-center mb-4">
    Nuevo Cliente
</h1>

<form th:action="@{/clientes/guardar}"
      th:object="${cliente}"
      method="post"
      novalidate>

  <input type="hidden"
         th:field="*{id}">

  <div class="mb-3">
    <label class="form-label">
      Nombre
    </label>
    <input type="text"
           th:field="*{nombre}"
           class="form-control">
    <div class="text-danger"
         th:if="${#fields.hasErrors('nombre')}"
         th:errors="*{nombre}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">
      Teléfono
    </label>
    <input type="text"
           th:field="*{telefono}"
           class="form-control">
    <div class="text-danger"
         th:if="${#fields.hasErrors('telefono')}"
         th:errors="*{telefono}">
    </div>

  </div>
  <div class="mb-3">
    <label class="form-label">
      Correo
    </label>
    <input type="email"
           th:field="*{correo}"
           class="form-control">
    <div class="text-danger"
         th:if="${#fields.hasErrors('correo')}"
         th:errors="*{correo}">
    </div>
  </div>

  <button type="submit"
          class="btn btn-success">
    Guardar
  </button>

  <a href="/clientes"
     class="btn btn-secondary">
    Cancelar
  </a>

</form>

</body>
</html>
